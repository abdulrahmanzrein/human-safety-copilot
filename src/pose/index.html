<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Human Safety Copilot</title>
  <link rel="stylesheet" href="../UI/hud.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0f;
      color: #e0e0e0;
      font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Header ── */
    .header {
      width: 100%;
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(12px);
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-logo {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      color: white;
    }

    .header-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #f0f0f5;
    }

    .header-subtitle {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.4);
      font-weight: 500;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .header-badge {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(99, 102, 241, 0.15);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.25);
      font-weight: 600;
    }

    /* ── Main content ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px;
      gap: 24px;
    }

    /* ── Video container ── */
    .container {
      position: relative;
      width: 720px;
      height: 540px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.06),
        0 20px 60px rgba(0, 0, 0, 0.5),
        0 0 80px rgba(99, 102, 241, 0.06);
      background: #111118;
    }

    .container::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 16px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), transparent, rgba(139, 92, 246, 0.15));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      z-index: 20;
    }

    video,
    canvas {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #output_canvas {
      z-index: 10;
      pointer-events: none;
    }

    .placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: rgba(255, 255, 255, 0.25);
      z-index: 5;
    }

    .placeholder-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 2px dashed rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }

    .placeholder-text {
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    /* ── Controls ── */
    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    #webcamButton {
      padding: 12px 28px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.3px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: linear-gradient(135deg, #6366f1, #7c3aed);
      color: white;
      box-shadow:
        0 0 0 1px rgba(99, 102, 241, 0.3),
        0 4px 16px rgba(99, 102, 241, 0.3);
      transition: all 0.2s ease;
      font-family: inherit;
    }

    #webcamButton:hover {
      transform: translateY(-1px);
      box-shadow:
        0 0 0 1px rgba(99, 102, 241, 0.4),
        0 8px 24px rgba(99, 102, 241, 0.35);
    }

    #webcamButton:active {
      transform: translateY(0);
    }

    #webcamButton.active {
      background: linear-gradient(135deg, #dc2626, #b91c1c);
      box-shadow:
        0 0 0 1px rgba(220, 38, 38, 0.3),
        0 4px 16px rgba(220, 38, 38, 0.3);
    }

    #webcamButton.active:hover {
      box-shadow:
        0 0 0 1px rgba(220, 38, 38, 0.4),
        0 8px 24px rgba(220, 38, 38, 0.35);
    }

    /* ── Footer ── */
    .footer {
      width: 100%;
      padding: 16px 32px;
      text-align: center;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.2);
      border-top: 1px solid rgba(255, 255, 255, 0.04);
    }
  </style>
</head>

<body>
  <header class="header">
    <div class="header-brand">
      <div class="header-logo">SC</div>
      <div>
        <div class="header-title">Human Safety Copilot</div>
        <div class="header-subtitle">Real-time posture monitoring</div>
      </div>
    </div>
    <span class="header-badge">MediaPipe Pose</span>
  </header>

  <main class="main">
    <div class="container">
      <div class="placeholder" id="placeholder">
        <div class="placeholder-icon">?</div>
        <div class="placeholder-text">Click below to start the webcam</div>
      </div>
      <video id="webcam" autoplay playsinline></video>
      <canvas id="output_canvas"></canvas>
    </div>

    <div class="controls">
      <button id="webcamButton">Start Webcam</button>
    </div>
  </main>

  <footer class="footer">
    Powered by MediaPipe Pose Landmarker &middot; All processing runs locally in your browser
  </footer>

  <script type="module" src="runtime.js"></script>
</body>

</html>
